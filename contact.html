<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CONTACT | SENA PORTFOLIO</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- HEADER -->

    <header class="header">

        <a href="index.html#home" class="logo">
            SENA PORTFOLIO
        </a>

            <nav class="nav">

    <a href="index.html#home">HOME</a>

    <a href="index.html#profile">PROFILE</a>

    <a href="index.html#service">SERVICE</a>

    <a href="index.html#web">WEB</a>

    <a href="index.html#video">VIDEO</a>

    <a href="contact.html">CONTACT</a>

</nav>

    </header>


    <main>

        <!-- CONTACT -->

        <section class="section contact-page">

            <div class="section-heading">

                <p class="section-label">
                    CONTACT
                </p>

                <h1>
                    お問い合わせ
                </h1>

                <p>
                    Web制作や動画編集についての<br>
                    ご相談・お問い合わせはこちらから。
                </p>

            </div>


                <form
    class="contact-form"
    action="https://formspree.io/f/xgavzqnr"
    method="POST"
>

                <div class="form-group">

                    <label for="name">
                        お名前
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="お名前を入力してください"
                          required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        メールアドレス
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@example.com"
                          required
                    >

                </div>


                <div class="form-group">

                    <label for="type">
                        お問い合わせ内容
                    </label>

                    <select id="type" name="type">

                        <option value="">
                            選択してください
                        </option>

                        <option value="web">
                            Web制作について
                        </option>

                        <option value="video">
                            動画編集について
                        </option>

                        <option value="other">
                            その他
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="message">
                        メッセージ
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="7"
                        placeholder="お問い合わせ内容をご入力ください"
                          required
                    ></textarea>
                    

                </div>


                <button type="submit" class="button">
                    SEND MESSAGE
                </button>

            </form>

        </section>

    </main>


    <footer class="footer">

        <p>
            © 2026 SENA PORTFOLIO
        </p>

    </footer>

</body>

</html>
